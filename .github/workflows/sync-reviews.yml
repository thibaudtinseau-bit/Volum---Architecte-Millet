name: Synchroniser les avis Google

on:
  schedule:
    - cron: "17 5 1,16 * *" # le 1er et le 16 du mois, ~7 h (Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-reviews.mjs
      - name: Publier sur main
        run: |
          git diff --quiet lib/reviews.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/reviews.json
          git commit -m "Avis Google : synchronisation automatique"
          git push
